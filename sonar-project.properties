sonar.projectKey=misawa3017_food
sonar.organization=misawa3017
sonar.host.url=https://sonarcloud.io

# Flutter 與 Cloud Functions 的原始碼範圍。
sonar.sources=lib,functions/src,android,ios,web
sonar.tests=test,functions/test
sonar.test.inclusions=**/*_test.dart,**/*.test.js

# 產生檔、建置輸出與 Functions 編譯輸出不納入掃描。
sonar.exclusions=**/*.g.dart,**/*.freezed.dart,build/**,.dart_tool/**,functions/lib/**,functions/node_modules/**,**/Pods/**
sonar.sourceEncoding=UTF-8
sonar.dart.coverage.reportPaths=coverage/lcov.info
