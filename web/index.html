<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="管吃：找附近好吃的店家。">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="food_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>管吃｜找附近好吃的</title>
  <link rel="manifest" href="manifest.json">
  <style>
    #app-loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background: #f7f7f2;
      color: #1d3329;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      transition: opacity 180ms ease-out, visibility 180ms ease-out;
    }
    #app-loading.is-hidden {
      opacity: 0;
      visibility: hidden;
    }
    .loading-content {
      display: grid;
      justify-items: center;
      gap: 14px;
      text-align: center;
    }
    .loading-icon { font-size: 42px; }
    .loading-title { font-size: 24px; font-weight: 800; }
    .loading-subtitle { color: #52645a; font-size: 14px; }
    .loading-spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #d5ddd2;
      border-top-color: #e9552c;
      border-radius: 50%;
      animation: loading-spin 800ms linear infinite;
    }
    @keyframes loading-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <output id="app-loading" aria-live="polite">
    <div class="loading-content">
      <div class="loading-icon" aria-hidden="true">🍴</div>
      <div class="loading-title">管吃</div>
      <div class="loading-subtitle">正在載入美食資訊</div>
      <div class="loading-spinner" aria-hidden="true"></div>
    </div>
  </output>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('app-loading')?.classList.add('is-hidden');
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
